name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mods need Claude Code 2.1.287 or newer. `plugin validate` and
      # `plugin test` run offline and need no sign-in.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate manifest, marketplace and hooks module
        run: claude plugin validate .

      - name: Run tests
        shell: bash
        run: |
          set +e
          claude plugin test . > test-out.txt 2>&1; status=$?
          cat test-out.txt
          if [ $status -ne 0 ]; then
            echo "::error title=plugin test::$(grep -v '(pass)' test-out.txt | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $status

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'

      - name: Test the NER server's pieces, cache and queue
        if: always()
        run: python -m unittest discover -s tools/ner-server -v
